<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SmartCity GIS - Asset Management</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; }
        #sidebar { width: 350px; padding: 20px; background: #f4f4f4; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 1000; overflow-y: auto;}
        #map { flex-grow: 1; height: 100%; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #007BFF; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Tambah Aset / Laporan</h2>
        <form id="assetForm">
            <div class="form-group">
                <label>Nama Aset / Fasilitas:</label>
                <input type="text" id="asset_name" required placeholder="Contoh: Lampu Jalan Taman UNIB">
            </div>
            <div class="form-group">
                <label>Kategori:</label>
                <select id="category">
                    <option value="Fasilitas Umum">Fasilitas Umum</option>
                    <option value="Infrastruktur Jalan">Infrastruktur Jalan</option>
                    <option value="Ruang Terbuka Hijau">Ruang Terbuka Hijau (Taman/Pohon)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Latitude:</label>
                <input type="text" id="latitude" readonly required>
            </div>
            <div class="form-group">
                <label>Longitude:</label>
                <input type="text" id="longitude" readonly required>
            </div>
            <p style="font-size: 12px; color: #666;">*Klik pada peta untuk menentukan lokasi titik aset.</p>
            <button type="submit">Simpan ke Cloud GIS</button>
        </form>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([-3.7589, 102.2605], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let selectedMarker = null;

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lng;

            if (selectedMarker) {
                map.removeLayer(selectedMarker);
            }
            selectedMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup('Lokasi Dipilih').openPopup();
        });

        function loadAssets() {
            fetch('/api/assets')
                .then(response => response.json())
                .then(data => {
                    data.forEach(asset => {
                        L.marker([asset.latitude, asset.longitude])
                            .addTo(map)
                            .bindPopup(`<b>${asset.asset_name}</b><br>Kategori: ${asset.category}<br>Status: ${asset.status}`);
                    });
                });
        }

        document.getElementById('assetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                asset_name: document.getElementById('asset_name').value,
                category: document.getElementById('category').value,
                latitude: parseFloat(document.getElementById('latitude').value),
                longitude: parseFloat(document.getElementById('longitude').value)
            };

            fetch('/api/assets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                alert(result.message);
                location.reload();
            });
        });

        loadAssets();
    </script>
</body>
</html>
